services:
  app:
    stdin_open: true
    tty: true
    
    build:
      context: .
      dockerfile: Dockerfile.dev

    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"

    environment:
      NODE_ENV: development

    volumes:
      - ./:/home/node/app
      - payload_node_modules:/home/node/app/node_modules
      - payload_next_cache:/home/node/app/.next

    command: >
      sh -c "
        if [ ! -f package.json ]; then
          echo '🚨 package.json not found.'
          echo 'Please clone Mod-B into this directory.'
          exit 1
        fi

        if [ \"$$INSTALL\" = \"yes\" ]; then
          echo '📦 Installing dependencies...'
          pnpm install || exit 1
        else
          echo '⏭️ Skipping install.'
        fi

        echo '🚀 Starting development server...'
        exec pnpm dev
      "

volumes:
  payload_node_modules:
  payload_next_cache: